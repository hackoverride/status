<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sastech - Status Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- .board is sized to exactly one screen, so the whole service matrix is
         visible at a glance on a wall display without scrolling. -->
    <div class="board">
      <header class="page-header">
        <h1>Status Board</h1>
        <div class="summary">
          <span id="summary-text">Loading…</span>
          <span class="last-updated" id="last-updated"></span>
        </div>
      </header>

      <main id="matrix" class="matrix">
        <!-- Column headings, category rows and status cells are generated by
             app.js from the endpoints and columns it fetches from
             /api/config, which server.js builds from .env -->
      </main>

      <footer class="page-footer">
        <span id="refresh-info"></span>
      </footer>
    </div>

    <section id="queues-section" class="categories">
      <!-- Queue cards are generated by app.js, only if any queues are configured -->
    </section>

    <script src="app.js"></script>
  </body>
</html>
