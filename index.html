<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sastech - Status Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Status</h1>
        <span class="last-updated" id="last-updated"></span>
      </header>

      <!-- One line answering "is anything wrong?": red when a service is down,
           amber for dead letters or an unreachable cluster, green otherwise. -->
      <div id="banner" class="banner">Loading…</div>

      <!-- Laid out for one wall screen: the cluster sections (the long
           lists) side by side on the left, everything short - Heroku and the
           queues - in a column on the right. Stacks on narrow screens. -->
      <div class="board">
        <!-- One block per SECTION_<n> (Prod, Demo, ...), each listing its
             services. Generated by app.js from /api/config and /api/status. -->
        <main id="sections" class="sections"></main>

        <aside class="side">
          <div id="side-sections" class="side-stack"></div>

          <!-- Shown only if any SERVICE_BUS_<n> is configured. Every queue,
               one block per namespace. -->
          <section id="queues" class="queues" hidden>
            <div class="queues-head">
              <h2>Queues</h2>
              <span class="section-summary" id="queue-summary"></span>
            </div>
            <div id="queue-list" class="side-stack"></div>
          </section>
        </aside>
      </div>

      <footer class="page-footer" id="refresh-info"></footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
